name: Android Build & Release

on:
  push:
    branches:
      - feature/whatsapp-updates-block
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.4

      - name: Build Debug APK
        working-directory: ./self-shield-android
        run: gradle assembleDebug

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SelfShield-Debug-APK
          path: self-shield-android/app/build/outputs/apk/debug/app-debug.apk
