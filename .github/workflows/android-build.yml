name: Android Build & Release

on:
  push:
    branches:
      - feature/whatsapp-updates-block
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.4

      - name: Build Debug APK
        working-directory: ./self-shield-android
        run: gradle assembleDebug

      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.1.0-beta
          name: Self Shield - Universal Release
          body: |
            This is a major update for Self Shield with universal language support and branding improvements.
            
            **What's New:**
            - **Universal Language Support:** WhatsApp Updates/Channels blocking now works in English, Bengali, Hindi, Spanish, Arabic, and more.
            - **New Branding:** Updated app icon and renamed to "Self Shield".
            - **Improved Visibility:** Fixed issues where the app was not appearing in Accessibility settings on some devices.
            - **Device Admin Protection:** Enhanced anti-tamper layers.
          draft: false
          prerelease: false
          files: self-shield-android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SelfShield-Debug-APK
          path: self-shield-android/app/build/outputs/apk/debug/app-debug.apk
