name: Android Build & Release

on:
  push:
    branches:
      - feature/whatsapp-updates-block
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.4

      - name: Build Debug APK
        working-directory: ./self-shield-android
        run: gradle assembleDebug

      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.2.2
          name: Self Shield v1.2.0 - Channel Blocker
          body: |
            **Self Shield v1.2.0**
            
            **What's New:**
            - **WhatsApp Channel Blocking:** Blocks Channels tab, individual channels, and channel explore pages
            - **3-Layer Detection:** Activity class name + tab detection + in-channel UI detection
            - **Toggle Switch:** Enable/disable channel blocking from the app
            - **Universal Language:** Works in English, Bengali, Hindi, Spanish, Arabic, and more
            - **New App Icon:** Updated branding with custom logo
            - **Accessibility Fix:** App now properly appears in Accessibility settings
          draft: false
          prerelease: false
          files: self-shield-android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SelfShield-Debug-APK
          path: self-shield-android/app/build/outputs/apk/debug/app-debug.apk
